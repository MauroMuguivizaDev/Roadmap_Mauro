<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Trilha de Estudos</title>
<style>
  :root{
    --bg:#ffffff; --bg-alt:#f4f4f3; --card:#ffffff;
    --line:#dcdcd9; --line-strong:#b8b8b3;
    --text:#1f1f1d; --text-dim:#5c5c58; --text-faint:#9c9c96;
    --accent:#2f6f4f; --accent-dim:#245a3f;
    --radius:6px;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:Arial, Helvetica, sans-serif;}
  .wrap{max-width:740px;margin:0 auto;padding:24px 18px 50px;}
  h1{font-size:22px;font-weight:bold;margin:0 0 4px;}
  .sub{color:var(--text-dim);font-size:14px;margin:0 0 20px;}
  .overall{display:flex;align-items:center;gap:14px;background:var(--bg-alt);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;margin-bottom:22px;}
  .overall-num{font-size:18px;font-weight:bold;color:var(--accent);}
  .overall-label{font-size:13px;color:var(--text-dim);}
  .bar-outer{flex:1;height:6px;background:var(--line);border-radius:3px;overflow:hidden;}
  .bar-inner{height:100%;background:var(--accent);border-radius:3px;}
  .phase{margin-bottom:10px;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;}
  .phase-head{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;cursor:pointer;user-select:none;background:var(--card);}
  .phase-head:hover{background:var(--bg-alt);}
  .phase-title{font-weight:bold;font-size:15px;}
  .phase-count{font-size:12px;color:var(--text-dim);}
  .phase-progress{height:3px;background:var(--line);}
  .phase-progress-inner{height:100%;background:var(--accent);}
  .chev{color:var(--text-faint);font-size:11px;}
  .phase-body{max-height:0;overflow:hidden;}
  .phase-body.open{max-height:1200px;}
  .course-list{padding:2px 14px 12px;}
  .course{display:flex;align-items:flex-start;gap:9px;padding:6px 0;border-bottom:1px solid var(--bg-alt);cursor:pointer;font-size:14px;line-height:1.4;}
  .course:last-child{border-bottom:none;}
  .box{flex-shrink:0;width:15px;height:15px;border:1px solid var(--line-strong);border-radius:3px;margin-top:2px;}
  .box.checked{background:var(--accent);border-color:var(--accent);}
  .course.checked .label{color:var(--text-faint);text-decoration:line-through;}
  .reset{background:var(--bg);border:1px solid var(--line);color:var(--text-dim);font-size:12px;padding:6px 12px;border-radius:var(--radius);cursor:pointer;margin-top:20px;}
  .reset:hover{border-color:var(--line-strong);color:var(--text);}
  .loading{color:var(--text-dim);font-size:13px;padding:16px 0;}
</style>
</head>
<body>
<div class="wrap">
  <h1>Trilha de estudos</h1>
  <p class="sub">Marca os cursos conforme for terminando. O progresso fica salvo nesse navegador.</p>
  <div class="overall">
    <div style="flex:1">
      <div style="display:flex;align-items:baseline;gap:8px;margin-bottom:6px;">
        <span class="overall-num" id="overall-num">0/0</span>
        <span class="overall-label">cursos concluídos</span>
      </div>
      <div class="bar-outer"><div class="bar-inner" id="overall-bar" style="width:0%"></div></div>
    </div>
  </div>
  <div id="content" class="loading">Carregando...</div>
  <button class="reset" id="reset-btn">Reiniciar progresso</button>
</div>

<script>
const DATA = [
  {id:'f0', name:'Fase 0 - Fundamentos', courses:[
    ['Programação para Iniciantes - Fabio Akita'],
    ['Lógica de Programação Completo 2023 - Jonathan de Souza'],
    ['Como Computadores Funcionam? - Fabio Akita'],
    ['Linux - Primeiros Passos - Gustavo Guanabara'],
    ['Terminal Linux - Diego Mariano'],
    ['Git e GitHub (sem terminal) - Gustavo Guanabara'],
    ['Git e Github 2024 - Carlos Uchoa'],
  ]},
  {id:'web', name:'Trilha Web', courses:[
    ['HTML5 e CSS3 - Módulos 1 a 4 - Gustavo Guanabara'],
    ['Frontend para Iniciantes - LuizTools'],
    ['JavaScript e ECMAScript - Gustavo Guanabara'],
    ['JavaScript Completo + 14 Mini-Projetos - Jhonatan de Souza'],
    ['Curso de Sass - Vida FullStack'],
    ['ReactJS - Fundamentos - Dev Samurai'],
    ['Curso de React - Matheus Battisti'],
    ['Curso de Node.js - Celke'],
    ['Serie API NodeJS - Rocketseat'],
    ['Banco de Dados MySQL - Gustavo Guanabara'],
    ['Modelagem de Dados - Bóson Treinamentos'],
    ['Dominando o Postgres - Dev Samurai'],
    ['Curso completo de Typescript - Rincko Dev'],
  ]},
  {id:'mobile', name:'Trilha Mobile', courses:[
    ['Desenvolvedor Android Iniciante - Gabriel Ferrari'],
    ['Aprenda Kotlin do zero - Pedro Massango'],
    ['Primeiro App com Flutter - André Baltieri'],
    ['Curso Flutter Básico [NV1] - Deivid Willyan'],
    ['Curso COMPLETO de Flutter - Flutterando'],
    ['Aprenda React Native - Canal Geek Dev'],
  ]},
  {id:'dados', name:'Trilha Dados / IA', courses:[
    ['Python 3 - Mundo 1: Fundamentos - Gustavo Guanabara'],
    ['Python 3 - Mundo 2: Estruturas de Controle - Gustavo Guanabara'],
    ['Python 3 - Mundo 3: Estruturas Compostas - Gustavo Guanabara'],
    ['Orientação a Objetos - Otávio Miranda'],
    ['Introdução à Ciência da Computação com Python - USP (Partes 1 e 2)'],
    ['Python Fundamentos para Análise de Dados - Data Science Academy'],
    ['Data Science e Machine Learning - Data ICMC'],
    ['Machine Learning e Data Science: Guia para Iniciantes - Jones Granatyr'],
    ['Deep Learning - Deep Learning Brasil'],
  ]},
  {id:'devops', name:'Trilha DevOps / Infra', courses:[
    ['Docker para iniciantes em 1 hora - Matheus Battisti'],
    ['Descomplicando o Docker - LINUXtips'],
    ['Introdução ao Kubernetes - Insight Lab'],
    ['Descomplicando o Kubernetes - LinuxTips'],
  ]},
  {id:'sistemas', name:'Trilha Sistemas / Performance', courses:[
    ['C e C++ - Fundamentos - One Day Code'],
    ['Curso de C - Cláudio Rogério Carvalho Filho'],
    ['Aprenda Rust - CodeShow'],
    ['Aprenda Go / Golang - NBK Mundo Tech'],
  ]},
  {id:'java', name:'Java', courses:[
    ['Java para Iniciantes - Gustavo Guanabara'],
    ['Programação Orientada a Objetos em Java - Gustavo Guanabara'],
    ['Java Básico - Loiane Groner'],
    ['Estrutura de Dados com Java - Loiane Groner'],
    ['Java, Spring COMPLETO e GRATUITO - Fernanda Kipper'],
    ['Aulões Spring Boot - Giuliana Bezerra'],
  ]},
  {id:'transversal', name:'Transversais', courses:[
    ['VS Code - Diego Martins de Pinho'],
    ['Segurança da Informação - Gustavo Guanabara'],
    ['Guia da Linguagem Markdown - Curso em Vídeo'],
    ['Redes de Computadores - Gustavo Guanabara'],
  ]},
];

let checked = {};
const content = document.getElementById('content');
const STORAGE_KEY = 'trilha-progresso';

function load(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw) checked = JSON.parse(raw);
  }catch(e){}
  render();
}

function save(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(checked)); }catch(e){}
}

function courseId(pid, idx){ return pid + '-' + idx; }

function render(){
  content.classList.remove('loading');
  let totalAll = 0, doneAll = 0;

  let html = '';
  DATA.forEach(phase => {
    const total = phase.courses.length;
    totalAll += total;
    let done = 0;
    phase.courses.forEach((c, i) => { if(checked[courseId(phase.id, i)]) done++; });
    doneAll += done;
    const pct = total ? Math.round(done/total*100) : 0;

    html += '<div class="phase">';
    html += '<div class="phase-head" data-toggle="'+phase.id+'">';
    html += '<span class="phase-title">'+phase.name+'</span>';
    html += '<span style="display:flex;align-items:center;gap:10px;">';
    html += '<span class="phase-count">'+done+'/'+total+'</span>';
    html += '<span class="chev" id="chev-'+phase.id+'">&#9660;</span>';
    html += '</span></div>';
    html += '<div class="phase-progress"><div class="phase-progress-inner" style="width:'+pct+'%"></div></div>';
    html += '<div class="phase-body" id="body-'+phase.id+'"><div class="course-list">';
    phase.courses.forEach((c, i) => {
      const cid = courseId(phase.id, i);
      const isChecked = !!checked[cid];
      html += '<div class="course '+(isChecked?'checked':'')+'" data-course="'+cid+'">';
      html += '<div class="box '+(isChecked?'checked':'')+'"></div>';
      html += '<div class="label">'+c[0]+'</div>';
      html += '</div>';
    });
    html += '</div></div></div>';
  });
  content.innerHTML = html;

  document.getElementById('overall-num').textContent = doneAll + '/' + totalAll;
  document.getElementById('overall-bar').style.width = (totalAll? Math.round(doneAll/totalAll*100):0) + '%';

  document.querySelectorAll('.phase-head').forEach(el => {
    el.addEventListener('click', () => {
      const id = el.getAttribute('data-toggle');
      const body = document.getElementById('body-'+id);
      const chev = document.getElementById('chev-'+id);
      const open = body.classList.toggle('open');
      chev.style.transform = open ? 'rotate(180deg)' : 'rotate(0deg)';
    });
  });

  document.querySelectorAll('.course').forEach(el => {
    el.addEventListener('click', () => {
      const cid = el.getAttribute('data-course');
      checked[cid] = !checked[cid];
      save();
      render();
    });
  });
}

document.getElementById('reset-btn').addEventListener('click', () => {
  checked = {};
  save();
  render();
});

load();
</script>
</body>
</html>
